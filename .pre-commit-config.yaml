repos:
  - repo: local
    hooks:
      - id: reflow-qmd
        name: Reflow .qmd files (semantic linebreaks)
        description: >
          Runs `coursecraft reflow` on staged .qmd files. If any file
          needed reformatting, the commit is stopped so you can review
          the change and re-stage it -- the same convention tools like
          black/prettier use, so a reformat is never silently folded
          into a commit without being seen first.
        entry: coursecraft reflow
        language: system
        files: ^(chapters|appendices|exercises|inserts)/.*\.qmd$
